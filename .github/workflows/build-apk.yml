name: Build Naruto Senki APK

on:
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pembersih Otomatis Ruang Disk & Sisa Cache
        run: |
          echo "=== Membersihkan ruang disk & file sementara ==="
          rm -rf /home/runner/work/_temp/*
          mkdir -p /home/runner/work/_temp
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/* /opt/ghc /usr/local/share/boost || true
          
          # Hapus seluruh komponen Android SDK di atas versi 31 (termasuk android-34-ext / 34x)
          sudo rm -rf $ANDROID_HOME/platforms/android-3[2-9]* $ANDROID_HOME/platforms/android-4* || true
          sudo rm -rf $ANDROID_HOME/build-tools/3[2-9]* $ANDROID_HOME/build-tools/4* || true
          sudo rm -rf $ANDROID_HOME/sources/android-3[2-9]* $ANDROID_HOME/sources/android-4* || true
          sudo rm -rf $ANDROID_HOME/system-images/android-3[2-9]* $ANDROID_HOME/system-images/android-4* || true
          sudo rm -rf $ANDROID_HOME/add-ons/* || true
          
          sudo apt-get clean
          df -h

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Android NDK r23b
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;23.1.7779620" "platforms;android-31" "build-tools;31.0.0"
          
          # 1. Hapus tag <base-extension> secara aman menggunakan Python agar XML tidak rusak
          python3 -c '
          import glob, re
          for path in glob.glob("'"$ANDROID_HOME"'/**/package.xml", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              cleaned = re.sub(r"<base-extension>.*?</base-extension>", "", content, flags=re.DOTALL)
              if cleaned != content:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(cleaned)
          '
          
          # 2. Lengkapi struktur folder platforms, meta, dan toolchains dummy agar AGP lama mengenali arm64-v8a di NDK r23b
          NDK_DIR="$ANDROID_HOME/ndk/23.1.7779620"
          mkdir -p "$NDK_DIR/platforms/android-21/arch-arm64/usr/include"
          mkdir -p "$NDK_DIR/platforms/android-21/arch-arm/usr/include"
          mkdir -p "$NDK_DIR/meta"
          
          cat << 'EOF' > "$NDK_DIR/meta/abis.json"
          {
            "armeabi-v7a": { "bitness": 32, "default": true, "deprecated": false },
            "arm64-v8a": { "bitness": 64, "default": true, "deprecated": false },
            "x86": { "bitness": 32, "default": true, "deprecated": false },
            "x86_64": { "bitness": 64, "default": true, "deprecated": false }
          }
          EOF
          
          for prefix in arm-linux-androideabi aarch64-linux-android x86 x86_64; do
            mkdir -p "$NDK_DIR/toolchains/${prefix}-4.9/prebuilt/linux-x86_64/bin"
          done
          
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV

      - name: Download & Setup Photon C++ SDK v6.0.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PHOTON_DIR="$GITHUB_WORKSPACE/external/photon"
          mkdir -p "$PHOTON_DIR/inc" "$PHOTON_DIR/libs" /tmp/photon_raw
          cd /tmp/photon_raw
          
          gh release download photon-sdk -R "${{ github.repository }}" -p "*.7z"
          for f in *.7z; do
            7z x "$f" -y
          done
          
          # Salin folder header (Common-cpp, Photon-cpp, LoadBalancing-cpp)
          for mod in Common-cpp Photon-cpp LoadBalancing-cpp; do
            FOUND_DIR=$(find /tmp/photon_raw -type d -iname "$mod" | head -n 1)
            if [ -n "$FOUND_DIR" ]; then
              cp -r "$FOUND_DIR" "$PHOTON_DIR/inc/"
            fi
          done
          
          echo "=== Semua file .a di arm64-v8a ==="
          find /tmp/photon_raw -path "*android/arm64-v8a*" -name "*.a"
          
          # Salin 3 library utama Photon
          cp $(find /tmp/photon_raw -path "*android/arm64-v8a*" -iname "*Common-cpp*release*.a" | head -n 1) "$PHOTON_DIR/libs/libcommon.a"
          cp $(find /tmp/photon_raw -path "*android/arm64-v8a*" -iname "*Photon-cpp*release*.a" | head -n 1) "$PHOTON_DIR/libs/libphoton.a"
          cp $(find /tmp/photon_raw -path "*android/arm64-v8a*" -iname "*LoadBalancing-cpp*release*.a" | head -n 1) "$PHOTON_DIR/libs/libloadbalancing.a"
          
          # Salin libcrypto/libssl bawaan Photon jika ada (untuk eg_ERR_print_errors_fp)
          CRYPTO_A=$(find /tmp/photon_raw -path "*android/arm64-v8a*" -iname "*crypto*.a" | head -n 1)
          SSL_A=$(find /tmp/photon_raw -path "*android/arm64-v8a*" -iname "*ssl*.a" | head -n 1)
          [ -n "$CRYPTO_A" ] && cp "$CRYPTO_A" "$PHOTON_DIR/libs/libegcrypto.a" || ar crs "$PHOTON_DIR/libs/libegcrypto.a"
          [ -n "$SSL_A" ] && cp "$SSL_A" "$PHOTON_DIR/libs/libegssl.a" || ar crs "$PHOTON_DIR/libs/libegssl.a"
          
          echo "=== Hasil akhir external/photon/libs ==="
          ls -la "$PHOTON_DIR/libs"
          rm -rf /tmp/photon_raw

      - name: Setup Java JDK 8 (Untuk Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Fix Header Path fmt & Build APK
        working-directory: projects/NarutoSenki/proj.android-studio
        run: |
          # Cari lokasi folder induk dari fmt/core.h di dalam repo
          FMT_CORE=$(find "$GITHUB_WORKSPACE" -path "*/fmt/core.h" | head -n 1)
          if [ -n "$FMT_CORE" ]; then
            FMT_INC=$(dirname $(dirname "$FMT_CORE"))
            echo "Ditemukan folder include fmt di: $FMT_INC"
            # Tambahkan path fmt ke Android.mk milik Lua dan proyek utama
            find "$GITHUB_WORKSPACE" -name "Android.mk" -exec sed -i "s|LOCAL_C_INCLUDES :=|LOCAL_C_INCLUDES := $FMT_INC|g" {} +
          else
            echo "PERINGATAN: fmt/core.h tidak ditemukan di repo, mengunduh fmt..."
            git clone --depth 1 --branch 9.1.0 https://github.com "$GITHUB_WORKSPACE/external/fmt"
            FMT_INC="$GITHUB_WORKSPACE/external/fmt/include"
            find "$GITHUB_WORKSPACE" -name "Android.mk" -exec sed -i "s|LOCAL_C_INCLUDES :=|LOCAL_C_INCLUDES := $FMT_INC|g" {} +
          fi
          find "$GITHUB_WORKSPACE" -name "Android.mk" -exec sed -i "s|LOCAL_C_INCLUDES :=|LOCAL_C_INCLUDES := $GITHUB_WORKSPACE/external/photon/inc|g" {} +
          
          echo "ndk.dir=$ANDROID_NDK_HOME" > local.properties
          echo "PROP_APP_ABI=arm64-v8a" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease -PPROP_APP_ABI=arm64-v8a --stacktrace

          # Membuat keystore sementara & menandatangani APK
          keytool -genkey -v -keystore release.keystore -alias naruto -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=NarutoSenki, OU=Dev, O=Game, L=ID, ST=ID, C=ID"
          
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          APK_UNSIGNED=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          $BUILD_TOOLS/zipalign -v -p 4 "$APK_UNSIGNED" aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out NarutoSenki-V2-Release.apk aligned.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Naruto Senki V2 Build #${{ github.run_number }}
          files: projects/NarutoSenki/proj.android-studio/NarutoSenki-V2-Release.apk

      - name: Pembersih Otomatis Setelah Build
        if: always()
        run: |
          rm -rf /home/runner/work/_temp/* || true
          rm -rf projects/NarutoSenki/proj.android-studio/app/build || true
